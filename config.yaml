model_list:
  - model_name: claude-4-5
    litellm_params:
      model: bedrock/arn:aws:bedrock:ap-southeast-2:135090718032:inference-profile/au.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: ap-southeast-2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true

guardrails:
  - guardrail_name: "company-pii-policy"
    litellm_params:
      guardrail: guardrails.guardrails.CompanyPIIGuardrail
      mode: "pre_call"
      default_on: true

litellm_settings:
  drop_params: true
  set_verbose: true     # NEVER true in prod, leaks API keys
  salt_key: os.environ/LITELLM_SALT_KEY
