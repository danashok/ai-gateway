# Authorized clients of the gateway.
#
# A request is authorized only when BOTH match:
#   1. The x-api-key header equals one of the api_key values below.
#   2. The source IP falls inside one of the allowed_ips entries
#      (single IP or CIDR range, IPv4 or IPv6).
#
# Copy this file to `auth.yaml` and edit. `auth.yaml` is gitignored.
clients:
  - name: laptop-dev
    api_key: sk-gw-replace-me-with-a-long-random-string
    allowed_ips:
      - 127.0.0.1
      - ::1
      - 10.0.0.0/8
