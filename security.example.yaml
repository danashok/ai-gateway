# Prompt-security rules. Each rule inspects the inbound system prompt and
# all user/assistant message text. A match raises HTTP 400 and the prompt
# is NOT forwarded to the backend.
#
# Rule types:
#   regex   - block if any of `patterns` matches; supports `ignore_case`.
#
# Copy to `security.yaml`. Path is configurable via SECURITY_CONFIG_PATH.
rules:
  - name: no-api-keys
    type: regex
    patterns:
      - 'sk-[A-Za-z0-9]{20,}'           # OpenAI / Anthropic style
      - 'AKIA[0-9A-Z]{16}'              # AWS access key id
      - 'AIza[0-9A-Za-z_\-]{35}'        # Google API key
      - 'ghp_[0-9A-Za-z]{36}'           # GitHub personal access token

  - name: no-ssn
    type: regex
    patterns:
      - '\b\d{3}-\d{2}-\d{4}\b'

  - name: no-private-keys
    type: regex
    ignore_case: true
    patterns:
      - '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
