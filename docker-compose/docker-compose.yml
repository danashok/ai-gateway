# Run the gateway in Docker.
#
# From the repo root:
#   docker compose -f docker-compose/docker-compose.yml up --build
#
# Settings come from ../.env (env_file). The two YAML configs are mounted
# read-only from the repo root so they are NOT baked into the image.
# Both must exist on the host before `up` (security.yaml can be empty).

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ai-gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    volumes:
      - ../auth.yaml:/app/auth.yaml:ro
      - ../security.yaml:/app/security.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').getcode()==200 else 1)\""
      interval: 30s
      timeout: 5s
      retries: 3
