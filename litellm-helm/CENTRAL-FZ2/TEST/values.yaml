# CENTRAL-FZ2 TEST environment overrides.
# Everything under the `litellm-helm:` key is passed through to the
# litellm-helm subchart (litellm-helm/charts/litellm-helm/values.yaml).
# Nested keys like `postgresql:` and `redis:` are forwarded to litellm-helm's
# own pg/redis sub-subcharts.

litellm-helm:
  replicaCount: 1
  # numWorkers: 2

  image:
    repository: ghcr.io/berriai/litellm-database
    pullPolicy: Always
    tag: ""

  imagePullSecrets: []
  nameOverride: "litellm"
  # Pinned so the vault-synced Secret names (litellm-masterkey,
  # litellm-dbcredentials) are stable regardless of release name — required by
  # postgresql.auth.existingSecret below.
  fullnameOverride: "litellm"

  serviceAccount:
    create: false
    automount: true
    annotations: {}
    name: ""

  deploymentAnnotations: {}
  deploymentLabels: {}
  deploymentMinReadySeconds: 0

  podAnnotations: {}
  podLabels: {}

  strategy: {}

  terminationGracePeriodSeconds: 90
  topologySpreadConstraints: []

  podSecurityContext: {}
  securityContext: {}

  environmentSecrets: []
  environmentConfigMaps: []

  service:
    type: ClusterIP
    port: 4000

  separateHealthApp: false
  separateHealthPort: 8081

  livenessProbe:
    path: /health/liveliness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    path: /health/readiness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  startupProbe:
    path: /health/readiness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 30

  ingress:
    enabled: false
    className: "nginx"
    labels: {}
    annotations:
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
      nginx.ingress.kubernetes.io/enable-real-ip: "true"
      nginx.ingress.kubernetes.io/proxy-real-ip-cidr: "0.0.0.0/0"
    hosts:
      - host: api.example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  # masterkey: changeit
  masterkeySecretName: ""
  masterkeySecretKey: ""

  # --------------------------------------------------------------------------
  # Vault-backed secrets (ricoberger vault-secrets-operator).
  # apiVersion: ricoberger.de/v1alpha1, kind: VaultSecret — hardcoded in templates.
  #
  # Each entry in `envs:` produces one container env var sourced via
  # secretKeyRef from the vault-synced k8s Secret. To add a new secret env var
  # (e.g. a third-party API key), append `{ name: ENV_NAME, key: vault-key }`
  # under the appropriate path's `envs:` — no template edit needed.
  # --------------------------------------------------------------------------
  vault:
    # Every env var referenced as `os.environ/<NAME>` in proxy_config above
    # must appear here. Add a new entry whenever you add another secret to
    # proxy_config — no template change needed.
    masterkey:
      path: "myvault/liteelm"
      envs:
        - name: LITELLM_MASTER_KEY
          key: masterkey
        - name: LITELLM_SALT_KEY
          key: salt_key
        - name: GUARDRAIL_API_KEY
          key: guardrail_api_key
        - name: OPENAI_COMPAT_MODEL
          key: openai_compat_model
        - name: OPENAI_COMPAT_API_BASE
          key: openai_compat_api_base
        - name: OPENAI_COMPAT_API_KEY
          key: openai_compat_api_key
    dbcredentials:
      path: "myvault/db"
      envs:
        - name: DATABASE_USERNAME
          key: username
        - name: DATABASE_PASSWORD
          key: password
        # If using external postgres (db.useExisting:true) and you want the
        # proxy to resolve `os.environ/DATABASE_URL` from a single vault value
        # instead of having the chart synthesize it from parts, add:
        # - name: DATABASE_URL
        #   key: url

  proxyConfigMap:
    create: true

  # Mirrors the local docker stack's ../../config.yaml verbatim.
  # All `os.environ/<VAR>` references must be backed by an env var on the
  # proxy pod — secret ones via `vault.*.envs` below, plain ones via `envVars`.
  proxy_config:
    model_list:
      - model_name: claude-4-5
        litellm_params:
          model: bedrock/arn:aws:bedrock:ap-southeast-2:135090718032:inference-profile/au.anthropic.claude-sonnet-4-5-20250929-v1:0
          aws_region_name: ap-southeast-2

      - model_name: custom-openai
        litellm_params:
          model: openai/os.environ/OPENAI_COMPAT_MODEL
          api_base: os.environ/OPENAI_COMPAT_API_BASE
          api_key: os.environ/OPENAI_COMPAT_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
      store_prompts_in_spend_logs: true
      use_x_forwarded_for: true

    guardrails:
      - guardrail_name: "company-pii-policy"
        litellm_params:
          guardrail: generic_guardrail_api
          mode: pre_call
          api_base: http://guardrails:8080/beta/litellm_basic_guardrail_api
          api_key: os.environ/GUARDRAIL_API_KEY
          unreachable_fallback: fail_closed
          default_on: true
          headers:
            X-Guardrail-Auth-Key: os.environ/GUARDRAIL_API_KEY
          extra_headers:
            - x-forwarded-for
            - x-real-ip
            - x-request-id
          additional_provider_specific_params:
            policy: pii

      - guardrail_name: "prompt-injection-policy"
        litellm_params:
          guardrail: generic_guardrail_api
          mode: pre_call
          api_base: http://guardrails:8080/beta/litellm_basic_guardrail_api
          api_key: os.environ/GUARDRAIL_API_KEY
          unreachable_fallback: fail_closed
          default_on: true
          headers:
            X-Guardrail-Auth-Key: os.environ/GUARDRAIL_API_KEY
          extra_headers:
            - x-forwarded-for
            - x-real-ip
            - x-request-id
          additional_provider_specific_params:
            policy: prompt_injection

    litellm_settings:
      drop_params: true
      set_verbose: false
      salt_key: os.environ/LITELLM_SALT_KEY

  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  keda:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    pollingInterval: 30
    cooldownPeriod: 300
    restoreToOriginalReplicaCount: false
    scaledObject:
      annotations: {}
    triggers: []
    behavior: {}

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # ----------------------------------------------------------------------------
  # Postgres connection.
  #
  # To use an EXISTING postgres (instead of the bundled Bitnami chart):
  #   1. Set `db.useExisting: true`
  #   2. Set `db.deployStandalone: false` (disables the Bitnami postgres subchart)
  #   3. Point `db.endpoint` at your postgres host (or use `db.secret.endpointKey`
  #      to source the host from the same secret as the credentials)
  #   4. Set `db.database` to the database name
  #   5. Create a k8s Secret in the release namespace holding the username/password
  #      and reference it via `db.secret.{name,usernameKey,passwordKey}`
  #   6. Leave `db.url` as-is — it gets templated with $(DATABASE_USERNAME),
  #      $(DATABASE_PASSWORD), $(DATABASE_HOST), $(DATABASE_NAME) from the secret/env.
  #   7. Delete (or ignore) the `postgresql:` block below — it's only consumed
  #      when `db.deployStandalone: true`.
  # ----------------------------------------------------------------------------
  db:
    useExisting: false
    endpoint: localhost
    database: litellm
    url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
    # The dbcredentials k8s Secret is materialized by ricoberger from
    # `vault.dbcredentials.path` (myvault/db). It holds username, password,
    # postgres-password (and any other keys you put at that vault path).
    # Both the bundled Bitnami postgres (via postgresql.auth.existingSecret)
    # and the litellm proxy (via vault.dbcredentials.envs) read from this
    # same Secret, so the provisioned user and the proxy creds stay aligned.
    secret:
      name: litellm-dbcredentials
      usernameKey: username
      passwordKey: password
      # Optional: when set, DATABASE_HOST is sourced from this secret key
      # instead of `db.endpoint` above. Useful when host is also a secret —
      # add a matching entry under `vault.dbcredentials.envs` if you want the
      # proxy pod to consume it too.
      endpointKey: ""
    useStackgresOperator: false
    # Set to false when using an existing postgres (see block above).
    deployStandalone: true

  lifecycle: {}

  # Bitnami postgresql sub-subchart — ONLY consumed when db.deployStandalone:true.
  # When using an existing postgres (see `db:` block above), this entire section
  # is ignored and the subchart is not installed.
  #
  # `auth.username` and `auth.database` are non-secret and stay as plain values
  # (Bitnami can't source the username from a secret). All passwords come from
  # the vault-synced `litellm-dbcredentials` k8s Secret via `existingSecret` —
  # the same Secret the litellm pod reads its DATABASE_PASSWORD from, so the
  # provisioned postgres user and the proxy credentials stay in lockstep.
  #
  # Required keys at vault path `myvault/db`:
  #   username           → must equal the literal `auth.username` below
  #   password           → user password (read via secretKeys.userPasswordKey)
  #   postgres-password  → admin password (read via secretKeys.adminPasswordKey)
  postgresql:
    architecture: standalone
    image:
      registry: registry-1.docker.io
      repository: bitnami/postgresql
      tag: latest
      digest: ""
      pullPolicy: IfNotPresent
      pullSecrets: []
    auth:
      username: litellm
      database: litellm
      existingSecret: "litellm-dbcredentials"
      secretKeys:
        userPasswordKey: password
        adminPasswordKey: postgres-password

  # ----------------------------------------------------------------------------
  # Redis (optional — only needed if proxy_config has `cache: true`).
  #
  # To use an EXISTING redis (instead of the bundled Bitnami chart):
  #   1. Leave `redis.enabled: false` (this disables the Bitnami redis subchart)
  #   2. Create a k8s Secret in the release namespace with REDIS_HOST, REDIS_PORT,
  #      REDIS_PASSWORD (or a single REDIS_URL) as keys.
  #   3. Wire it into the proxy pod by adding the secret name to
  #      `environmentSecrets:` at the top of this file, e.g.:
  #         environmentSecrets:
  #           - litellm-redis-secret
  #   4. Make sure `cache: true` is set in `proxy_config` (or the relevant
  #      cache-using guardrail/router config) so LiteLLM actually reads them.
  #   5. The `image:` block below is then unused and can be left as-is.
  # ----------------------------------------------------------------------------
  redis:
    enabled: false
    architecture: standalone
    image:
      registry: registry-1.docker.io
      repository: bitnami/redis
      tag: latest
      digest: ""
      pullPolicy: IfNotPresent
      pullSecrets: []

  migrationJob:
    enabled: true
    retries: 3
    backoffLimit: 4
    disableSchemaUpdate: false
    serviceAccountName: ""
    annotations: {}
    ttlSecondsAfterFinished: 120
    resources: {}
    extraContainers: []
    extraInitContainers: []
    hooks:
      argocd:
        enabled: true
      helm:
        enabled: false

  envVars: {}
  extraEnvVars: {}

  command: {}
  args: {}

  extraResources: []

  pdb:
    enabled: false
    minAvailable: null
    maxUnavailable: null
    annotations: {}
    labels: {}

  serviceMonitor:
    enabled: false
    labels: {}
    annotations: {}
    interval: 15s
    scrapeTimeout: 10s
    relabelings: []
    namespaceSelector:
      matchNames: []
